<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Povolení k práci – Knauf Insulation Krupka</title>
<meta name="theme-color" content="#003778">
<meta name="description" content="Digitální povolení k práci – Knauf Insulation, závod Krupka">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Povolení k práci">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{
  --cyan:#0099de;--cyan80:#33ade5;--cyan40:#99d6f2;--cyan20:#ccebf8;--cyan10:#e6f5fc;
  --blue:#003778;--dkgreen:#004b46;--green:#87c15f;--green40:#d2e7c0;
  --orange:#f06e00;--orange40:#fac69a;--yellow:#ffd25c;--yellow40:#ffedc1;
  --grey:#cfd7d9;--grey70:#dde2e5;--grey40:#ebeef0;--bg:#f6f8f9;
  --red:#c62828;--red10:#fdecea;
  --text:#1b2a35;--muted:#5d6d78;
  --radius:10px;--shadow:0 1px 2px rgba(0,30,60,.06),0 4px 14px rgba(0,30,60,.06);
  --font:"Knauf Screen","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --font-head:"Knauf Screen Head","Knauf Screen","Segoe UI",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
h1,h2,h3,h4{font-family:var(--font-head);color:var(--blue);margin:0}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}h4{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,Consolas,monospace}
.hide{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:3px solid var(--cyan);display:flex;align-items:center;gap:18px;padding:0 20px;height:62px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:34px}
.wordmark{font-family:var(--font-head);font-weight:800;font-size:19px;letter-spacing:.02em;color:var(--blue);white-space:nowrap}
.wordmark span{color:var(--cyan);font-weight:400;font-style:italic}
.brand .app{border-left:1px solid var(--grey);padding-left:12px;line-height:1.15}
.brand .app b{display:block;color:var(--blue);font-size:15px}
.brand .app small{color:var(--muted);font-size:11.5px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{background:none;border:0;padding:9px 13px;border-radius:8px;cursor:pointer;color:var(--blue);font-weight:600;display:flex;align-items:center;gap:7px}
.nav button:hover{background:var(--cyan10)}
.nav button.on{background:var(--cyan);color:#fff}
.lang{display:flex;border:1px solid var(--grey);border-radius:8px;overflow:hidden}
.lang button{border:0;background:#fff;padding:6px 9px;cursor:pointer;font-weight:700;font-size:12px;color:var(--muted)}
.lang button.on{background:var(--blue);color:#fff}
.ico{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{max-width:1380px;margin:0 auto;padding:22px 20px 60px}
.pagehead{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pagehead .sp{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--grey);background:#fff;color:var(--blue);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#fff}
.btn.primary:hover{background:#0088c6}
.btn.dark{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ok{background:var(--dkgreen);border-color:var(--dkgreen);color:#fff}
.btn.warn{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.danger{color:var(--red);border-color:#f0c4c4}
.btn.danger:hover{background:var(--red10)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* cards */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card+.card{margin-top:16px}
.card h3{margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .num{background:var(--blue);color:#fff;border-radius:6px;font-size:12px;padding:2px 7px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;border-top:4px solid var(--cyan);cursor:default}
.kpi b{display:block;font-size:30px;font-family:var(--font-head);color:var(--blue);line-height:1.1}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.green{border-color:var(--green)}.kpi.orange{border-color:var(--orange)}.kpi.red{border-color:var(--red)}.kpi.yellow{border-color:var(--yellow)}.kpi.dark{border-color:var(--blue)}

/* fields */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.f input[type=text],.f input[type=tel],.f input[type=number],.f input[type=datetime-local],.f input[type=date],.f select,.f textarea,.inp{border:1px solid var(--grey);border-radius:7px;padding:8px 10px;background:#fff;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{outline:2px solid var(--cyan40);border-color:var(--cyan)}
.f input:disabled,.f select:disabled,.f textarea:disabled{background:var(--grey40);color:#43525c}
.req>label::after{content:" *";color:var(--orange)}
.hint{font-size:12px;color:var(--muted)}
.yn{display:inline-flex;border:1px solid var(--grey);border-radius:7px;overflow:hidden;flex:none}
.yn button{border:0;background:#fff;padding:6px 13px;font-weight:700;cursor:pointer;color:var(--muted);font-size:12.5px}
.yn button+button{border-left:1px solid var(--grey)}
.yn button.on.y{background:var(--dkgreen);color:#fff}
.yn button.on.n{background:var(--orange);color:#fff}
.yn button:disabled{cursor:default}
.ynrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--grey40)}
.ynrow:last-child{border-bottom:0}
.ynrow .q{flex:1}
.chk{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;user-select:none}
.chk:hover{background:var(--cyan10)}
.chk input{margin-top:2px;width:16px;height:16px;accent-color:var(--cyan);flex:none}
.chk.on{background:var(--cyan10)}
.chk.dis{cursor:default}
.riskgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.riskcol{border:1px solid var(--grey70);border-radius:9px;overflow:hidden}
.riskcol h4{background:var(--blue);color:#fff;padding:7px 10px;font-size:11.5px}
.riskcol .chk{font-size:12.5px;border-radius:0}
.radioline{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--grey);border-radius:20px;padding:6px 12px;cursor:pointer;background:#fff;font-weight:600;font-size:12.5px;color:var(--blue)}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pill:disabled{cursor:default}

/* table */
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--grey70);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--grey40);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--cyan10)}
table.t input.inp{padding:6px 8px}

/* status badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.b-draft{background:var(--grey40);color:#4a5963}
.b-active{background:var(--green40);color:var(--dkgreen)}
.b-suspended{background:var(--yellow40);color:#7a5600}
.b-expired{background:var(--red10);color:var(--red)}
.b-completed{background:var(--cyan20);color:var(--blue)}
.b-closed{background:var(--blue);color:#fff}
.b-cancelled{background:#eee;color:#888;text-decoration:line-through}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;background:var(--cyan10);color:var(--blue);margin:1px 2px 1px 0}
.tag.hot{background:#fde4d0;color:#a34a00}
.tag.atm{background:#e5e0f5;color:#4b3a8c}
.tag.warn{background:var(--red10);color:var(--red)}

/* editor layout */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.tabs{display:flex;gap:2px;flex-wrap:wrap;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:5px;margin-bottom:16px}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--blue);display:flex;gap:6px;align-items:center;font-size:13px}
.tabs button:hover{background:var(--cyan10)}
.tabs button.on{background:var(--blue);color:#fff}
.tabs .dot{width:8px;height:8px;border-radius:50%;background:var(--grey)}
.tabs .dot.ok{background:var(--green)}.tabs .dot.bad{background:var(--orange)}
.side{position:sticky;top:80px;display:flex;flex-direction:column;gap:14px}
.side .card{padding:15px}
.side .card+.card{margin-top:0}
.permno{font-family:var(--font-head);font-size:28px;color:var(--blue);font-weight:800;letter-spacing:.02em}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:8px;padding:5px 0;font-size:12.8px;align-items:flex-start;border-bottom:1px dashed var(--grey40)}
.checklist li:last-child{border:0}
.checklist .st{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;margin-top:1px}
.checklist .ok .st{background:var(--green)}
.checklist .bad .st{background:var(--orange)}
.checklist li.bad{cursor:pointer}
.checklist li.bad:hover{color:var(--cyan)}
.banner{border-radius:9px;padding:11px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.banner.info{background:var(--cyan10);color:var(--blue);border-left:4px solid var(--cyan)}
.banner.warn{background:#fff3e8;color:#8a3f00;border-left:4px solid var(--orange)}
.banner.err{background:var(--red10);color:var(--red);border-left:4px solid var(--red)}
.banner.ok{background:#eef6e8;color:var(--dkgreen);border-left:4px solid var(--green)}

/* signatures */
.sig{border:1px dashed var(--grey);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:92px;background:#fff}
.sig .role{font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.03em}
.sig.done{border-style:solid;border-color:var(--green);background:#fbfdf9}
.sig img{height:44px;object-fit:contain;object-position:left;max-width:100%}
.sig .who{font-weight:700;color:var(--blue)}
.sig .when{font-size:11.5px;color:var(--muted)}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}

/* copies */
.copy{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--grey40)}
.copy:last-child{border:0}
.copy .ci{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.copy .ci.o{background:var(--blue)}.copy .ci.b{background:var(--cyan)}.copy .ci.m{background:var(--dkgreen)}
.copy .tx{flex:1;min-width:0;font-size:12.8px}
.copy .tx b{display:block;color:var(--blue)}

/* fire watch */
.watch{border-radius:10px;padding:14px;background:linear-gradient(135deg,#fff7f0,#fff);border:1px solid #f9d3b3}
.watch .big{font-family:var(--font-head);font-size:26px;font-weight:800;color:#a34a00}
.timeline{list-style:none;padding:0;margin:8px 0 0}
.timeline li{display:flex;gap:10px;padding:6px 0;font-size:12.8px;border-bottom:1px dashed var(--grey40)}
.timeline li b{min-width:96px;color:var(--blue)}
.gas td.bad{background:var(--red10);color:var(--red);font-weight:700}
.gas td.okv{color:var(--dkgreen);font-weight:700}

/* modal */
.modalbg{position:fixed;inset:0;background:rgba(0,25,50,.45);z-index:200;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(560px,100%);max-height:92vh;overflow:auto}
.modal header{padding:15px 18px;border-bottom:1px solid var(--grey40);display:flex;align-items:center;gap:10px}
.modal header h3{flex:1}
.modal .body{padding:18px}
.modal footer{padding:12px 18px;border-top:1px solid var(--grey40);display:flex;justify-content:flex-end;gap:8px}
.pad{border:2px dashed var(--cyan40);border-radius:9px;width:100%;height:180px;touch-action:none;background:#fff;cursor:crosshair;display:block}
.qrbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qrbox svg{width:230px;height:230px;border:1px solid var(--grey);border-radius:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 18px;border-radius:9px;z-index:300;box-shadow:var(--shadow);font-weight:600}

/* list filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .inp{width:260px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty>svg{width:56px;height:56px;stroke:var(--cyan40);margin-bottom:8px}

/* BOARD */
body.boardmode{background:#eef3f6}
body.boardmode .topbar{display:none}
body.boardmode main{max-width:none;padding:0}
.board{min-height:100vh;display:flex;flex-direction:column}
.bhead{background:var(--blue);color:#fff;display:flex;align-items:center;gap:22px;padding:14px 28px;border-bottom:6px solid var(--cyan)}
.bhead .wordmark{color:#fff}.bhead .wordmark span{color:var(--cyan40)}
.bhead h1{color:#fff;font-size:26px}
.bhead .clock{margin-left:auto;font-family:var(--font-head);font-size:40px;font-weight:800;letter-spacing:.03em}
.bhead .date{font-size:14px;opacity:.85;text-align:right}
.bstats{display:flex;gap:14px;padding:16px 28px 0}
.bstat{background:#fff;border-radius:12px;padding:10px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);border-left:6px solid var(--cyan)}
.bstat b{font-size:34px;font-family:var(--font-head);color:var(--blue)}
.bstat span{font-size:14px;color:var(--muted);font-weight:600;line-height:1.2}
.bstat.hot{border-color:var(--orange)}.bstat.atm{border-color:#6c5bb8}.bstat.red{border-color:var(--red)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;padding:16px 28px 28px}
.bcard{background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;border-top:8px solid var(--green)}
.bcard.suspended{border-color:var(--yellow)}.bcard.expired{border-color:var(--red)}.bcard.soon{border-color:var(--orange)}
.bcard .top{padding:14px 18px 8px;display:flex;align-items:flex-start;gap:10px}
.bcard .no{font-family:var(--font-head);font-weight:800;font-size:28px;color:var(--blue);line-height:1}
.bcard .loc{font-size:18px;font-weight:700;color:var(--text);padding:0 18px}
.bcard .desc{padding:4px 18px 8px;color:var(--muted);font-size:14.5px}
.bcard .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:8px 18px;font-size:14px}
.bcard .meta i{font-style:normal;color:var(--muted);font-size:12px;display:block;text-transform:uppercase;letter-spacing:.03em}
.bcard .meta b{color:var(--blue)}
.bcard .tags{padding:4px 18px 10px}
.bcard .tags .tag{font-size:12.5px;padding:3px 8px}
.bcard .foot{margin-top:auto;background:var(--grey40);padding:10px 18px;display:flex;align-items:center;gap:10px;font-size:14px}
.bcard .count{margin-left:auto;font-family:var(--font-head);font-weight:800;font-size:22px;color:var(--dkgreen)}
.bcard.soon .count{color:var(--orange)}.bcard.expired .count{color:var(--red)}
.bcard .fw{background:#fff3e8;border-top:1px solid #f9d3b3;padding:9px 18px;font-size:14px;color:#8a3f00;font-weight:700;display:flex;gap:8px;align-items:center}
.bcard .fw.over{background:var(--red);color:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.6}}
.bcopy{position:fixed;bottom:10px;right:16px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.8);padding:4px 10px;border-radius:6px}
.bctl{position:fixed;bottom:10px;left:16px;display:flex;gap:6px;opacity:.15;transition:.2s;z-index:10}
.bctl:hover{opacity:1}

/* MOBILE COPY */
body.mobilemode{background:#eef3f6}
body.mobilemode .topbar{display:none}
body.mobilemode main{padding:0;max-width:560px}
.mhead{background:var(--blue);color:#fff;padding:16px 18px 14px;position:relative;overflow:hidden}
.mhead .wordmark{color:#fff;font-size:15px}.mhead .wordmark span{color:var(--cyan40)}
.mhead .wm{position:absolute;right:-12px;top:6px;font-size:64px;font-weight:900;opacity:.09;letter-spacing:.06em;transform:rotate(-8deg)}
.mhead .no{font-family:var(--font-head);font-size:34px;font-weight:800;margin-top:8px;line-height:1}
.mhead .ty{font-size:13px;opacity:.85}
.mstate{padding:16px 18px;text-align:center;color:#fff;background:var(--dkgreen)}
.mstate.bad{background:var(--red)}.mstate.warn{background:var(--orange)}
.mstate b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.mstate .cd{font-family:var(--font-head);font-size:34px;font-weight:800}
.mstate .vt{font-size:13px;opacity:.9}
.msec{background:#fff;margin:10px 10px 0;border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.msec h3{margin-bottom:8px;font-size:14px;display:flex;align-items:center;gap:7px}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--grey40);font-size:14px}
.mrow:last-child{border:0}
.mrow span{color:var(--muted)}
.mrow b{text-align:right;color:var(--text)}
.mcall{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--red);color:#fff;text-decoration:none;font-weight:800;padding:13px;border-radius:10px;font-size:16px;margin-top:8px}
.mcall.sec{background:var(--cyan)}
.mnote{font-size:12px;color:var(--muted);padding:14px 18px 30px;text-align:center}

/* PRINT */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block;font-size:10.5px;color:#000}
  #print h1{font-size:17px;color:#000}
  #print h2{font-size:13px;color:#000;background:#e8eef2;padding:4px 6px;margin:10px 0 4px;border-left:4px solid var(--cyan)}
  #print table{width:100%;border-collapse:collapse;margin-bottom:4px}
  #print td,#print th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
  #print th{background:#f2f2f2;width:32%}
  #print .ph{display:flex;align-items:center;border:2px solid #000;margin-bottom:8px}
  #print .ph>div{padding:8px 10px}
  #print .ph .c{flex:1;text-align:center;border-left:2px solid #000;border-right:2px solid #000}
  #print .stamp{font-weight:900;font-size:15px;text-align:right}
  #print img.s{height:28px}
  #print .pb{page-break-before:always}
  #print .qr svg{width:90px;height:90px}
}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .riskgrid{grid-template-columns:repeat(3,1fr)}
  .editor{grid-template-columns:1fr}
  .side{position:static}
}
@media (max-width:720px){

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

    _this.createSvgTag = function(cellSize, margin, alt, title) {

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      title.text = title.text || null;

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +

      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {

            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {

      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.

/* ---------- derived ---------- */
function validEnd(p){let t=T(p.s8.validTo);p.extensions.forEach(e=>{const u=T(e.until);if(u>t)t=u});return t}
function effStatus(p){if(p.status==='active'&&Date.now()>validEnd(p))return 'expired';return p.status}
function isLive(p){const s=effStatus(p);return s==='active'||s==='suspended'||s==='expired'}
function gasEval(k,v){const l=S.settings.limits;if(v===''||v==null||isNaN(+v))return null;v=+v;if(k==='o2')return v<l.o2min||v>l.o2max;return v>l[k]}
function measDanger(m){let any=false,bad=false;GASES.forEach(g=>{const r=gasEval(g[0],m.v[g[0]]);if(r!==null)any=true;if(r)bad=true});if(m.v.otherName&&m.v.otherDanger==='A')bad=true;return {any,bad,o2:m.v.o2!==''&&m.v.o2!=null}}
function lastMeas(p){return p.atm&&p.atm.meas.length?p.atm.meas[p.atm.meas.length-1]:null}
function fireWatch(p){
 const h=p.hot;if(!h||!h.weldEnd||h.reported)return null;
 const end=h.weldEnd+h.postHours*3600000;const checks=h.log.filter(x=>x.type==='check'&&x.at>=h.weldEnd);
 const last=checks.length?checks.at(-1).at:h.weldEnd;const next=last+h.interval*60000;
 return {until:end,next,overdue:Date.now()>next&&Date.now()<end,finished:Date.now()>=end,checks:checks.length}
}
function welding(p){const h=p.hot;return h&&h.weldStart&&!h.weldEnd}

 const c=[];const add=(ok,cs,en,tab)=>c.push({ok:!!ok,t:L(cs,en),tab});

 add(p.s3.system,'Systém bezpečné práce zvolen','Safe system of work selected','risk');
 const declOk=DECL.every(d=>p.s4[d[0]]==='A')||(DECL.every(d=>p.s4[d[0]])&&p.notes.trim());
 add(declOk,'Prohlášení příjemce (sekce 4) – ANO, nebo zdůvodnění','Receiver declaration (sec. 4) – YES or justification','risk');
 add(p.s6.required,'Požadavek na odpojení A/N','Isolation required Y/N','iso');
 if(p.s6.required==='A')add(p.s6.allIsolated==='A'&&p.s6.isolatedBy&&p.s6.method,'Odpojení provedeno a popsáno (kým, způsob)','Isolation done and described','iso');
 add(Object.values(p.ppe).some(Boolean),'OOPP určeny','PPE specified','iso');
 const vf=T(p.s8.validFrom),vt=T(p.s8.validTo);
 add(vf&&vt&&vt>vf,'Platnost od–do (konec po začátku)','Validity from–to (end after start)','appr');
 if(vt-vf>12*3600000)add(p.s8.hse,'Práce delší než 12 h → schválení HSE','Work over 12 h → HSE approval','appr');
 add(p.workers.length&&p.workers.every(w=>w.name&&w.sig),'Seznam pracovníků s podpisy','Workers listed and signed','appr');
 add(p.s8.issuedBy,'Podpis – povolení vydal','Signature – issued by','appr');
 add(p.s8.shift,'Podpis – vedoucí směny','Signature – shift manager','appr');
 add(p.s8.receiver,'Podpis – příjemce povolení','Signature – permit receiver','appr');
 const hiRisk=p.s5.hot||p.s5.confined||p.s5.atex||p.s3.system==='unapproved';
 if(hiRisk)add(p.s8.hse,'Vysoce rizikové práce → podpis manažera HSE','High-risk work → HSE manager signature','appr');
 const itRisk=RISKS.find(g=>g.g==='it').items.some(i=>p.risks[i[0]]);
 if(itRisk)add(p.s8.it,'Riziko IT/OT → podpis IT specialisty','IT/OT risk → IT specialist signature','appr');
 if(p.s5.hot){const h=p.hot;
  add(h&&h.welders[0].name&&h.welders[0].cert&&h.welders[0].sig,'KK_053: svářeč (jméno, č. průkazu, podpis)','KK_053: welder (name, cert. no., signature)','hot');
  add(h&&h.method,'KK_053: způsob svařování','KK_053: welding method','hot');
  add(h&&HOTCHK.filter(x=>x[3]).every(x=>h.chk[x[0]]),'KK_053: požárně bezpečnostní opatření potvrzena','KK_053: fire-safety measures confirmed','hot');
  add(h&&h.watchers[0],'KK_053: určen požární dohled','KK_053: fire watch appointed','hot');
  add(h&&h.reportTo.name,'KK_053: komu se hlásí ukončení','KK_053: termination reported to','hot');
  add(h&&h.issuer&&h.ackWatch&&h.ackAppointer,'KK_053: podpisy (vydal, poučení dohledu)','KK_053: signatures (issuer, fire watch briefing)','hot');
  if(h&&h.chk.gasmon)add(p.s5.confined,'KK_053 bod 16: měření → aktivovat KK_F047','KK_053 item 16: monitoring → enable KK_F047','add');
 }
 if(p.s5.confined){const a=p.atm,m=lastMeas(p);
  add(a&&(a.space&&(a.space!=='other'||a.spaceOther)),'KK_047: uzavřený prostor určen','KK_047: confined space defined','atm');
  add(m&&measDanger(m).o2&&!measDanger(m).bad&&m.by&&m.dev,'KK_047: poslední měření bez nebezpečné koncentrace (vč. O₂)','KK_047: latest measurement safe (incl. O₂)','atm');
  add(a&&ATMCHK.every(x=>a.chk[x[0]]),'KK_047: body A, B, C potvrzeny','KK_047: items A, B, C confirmed','atm');
  add(a&&a.entrants.length&&a.entrants.every(e=>e.name&&e.sig),'KK_047: vstupující osoby podepsány','KK_047: entrants signed','atm');
  add(a&&a.responsible&&a.ackSafe,'KK_047: podpisy odpovědné osoby','KK_047: responsible person signatures','atm');
 }
 return c;
}

async function encodePayload(obj){
 const json=JSON.stringify(obj);
 try{if(window.CompressionStream){const cs=new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));const buf=new Uint8Array(await new Response(cs).arrayBuffer());return 'z'+b64u(buf)}}catch(e){}
 return 'j'+b64u(new TextEncoder().encode(json));
}
async function decodePayload(s){
 const kind=s[0],bytes=unb64u(s.slice(1));
 if(kind==='z'){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(ds).text())}
 return JSON.parse(new TextDecoder().decode(bytes));
}
function b64u(u8){let s='';for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function baseUrl(){const u=(S.settings.publicUrl||'').trim();if(u)return u.split('#')[0];return location.href.split('#')[0]}

/* ---------- router ---------- */
let R={view:'dash',id:null,tab:'basic',filter:'live',q:''};
function go(view,id,tab){R.view=view;if(id!==undefined)R.id=id;if(tab)R.tab=tab;render();window.scrollTo(0,0)}

function render(){
 document.documentElement.lang=LANG;
 document.body.classList.toggle('boardmode',R.view==='board');
 document.body.classList.remove('mobilemode');
 $('#topbar').innerHTML=topbar();
 const m=$('#main');
 if(R.view==='dash')m.innerHTML=viewDash();
 else if(R.view==='list')m.innerHTML=viewList();
 else if(R.view==='edit'){const p=P(R.id);if(!p){R.view='list';return render()}m.innerHTML=viewEdit(p)}
 else if(R.view==='board')m.innerHTML=viewBoard();
 else if(R.view==='settings')m.innerHTML=viewSettings();
 afterRender();
}
function topbar(){
 const b=(v,i,cs,en)=>`<button class="${R.view===v||(v==='list'&&R.view==='edit')?'on':''}" data-act="go" data-v="${v}">${ic(i)}<span>${L(cs,en)}</span></button>`;
 return `<div class="brand">${brandHTML()}<div class="app"><b>${L('Povolení k práci','Permit to Work')}</b><small>${esc(S.settings.plant)} · KI_F_057 · KK_053 · KK_047</small></div></div>
 <nav class="nav">${b('dash','home','Přehled','Overview')}${b('list','list','Povolení','Permits')}${b('board','board','Digitální board','Digital board')}${b('settings','gear','Nastavení','Settings')}</nav>
 ${!isStandalone()&&(installEvt||location.protocol==='https:')?`<button class="btn sm installbtn" data-act="install" title="${L('Nainstalovat do PC / telefonu','Install on PC / phone')}">${ic('dl')}<span class="hide-sm">${L('Instalovat','Install')}</span></button>`:''}
 <div class="lang"><button class="${LANG==='cs'?'on':''}" data-act="lang" data-l="cs">CZ</button><button class="${LANG==='en'?'on':''}" data-act="lang" data-l="en">EN</button></div>`;
}

/* ---------- dashboard ---------- */
function viewDash(){
 const ps=S.permits;const now=Date.now();
 const live=ps.filter(p=>effStatus(p)==='active');
 const susp=ps.filter(p=>effStatus(p)==='suspended');
 const exp=ps.filter(p=>effStatus(p)==='expired');
 const soon=live.filter(p=>validEnd(p)-now<S.settings.soonMin*60000);
 const hot=ps.filter(p=>isLive(p)&&p.s5.hot&&(welding(p)||fireWatch(p)));
 const atm=ps.filter(p=>isLive(p)&&p.s5.confined);
 const drafts=ps.filter(p=>p.status==='draft');
 const stale=ps.filter(p=>isLive(p)&&p.copies.mobile.length&&p.copies.mobile.at(-1).key!==payloadKey(p));
 const k=(n,cs,en,c,f)=>`<div class="kpi ${c}" ${f?`data-act="filter" data-f="${f}" style="cursor:pointer"`:''}><b>${n}</b><span>${L(cs,en)}</span></div>`;
 let alerts='';
 exp.forEach(p=>alerts+=`<div class="banner err">${ic('alert')}<div><b>${esc(p.no)}</b> – ${L('platnost vypršela','validity expired')} ${fmt(toLocal(validEnd(p)))}. ${L('Práce musí být přerušeny, povolení prodlouženo nebo ukončeno.','Work must stop; extend or close the permit.')} <a href="#" data-act="open" data-id="${p.id}">${L('Otevřít','Open')}</a></div></div>`);
 ps.filter(p=>isLive(p)&&fireWatch(p)?.overdue).forEach(p=>alerts+=`<div class="banner err">${ic('flame')}<div><b>${esc(p.no)}</b> – ${L('kontrola požárního dohledu po svařování je po termínu','post-weld fire-watch check overdue')} (${fmtTime(fireWatch(p).next)}). <a href="#" data-act="open" data-id="${p.id}" data-tab="hot">${L('Zapsat kontrolu','Log check')}</a></div></div>`);
 stale.forEach(p=>alerts+=`<div class="banner warn">${ic('mobile')}<div><b>${esc(p.no)}</b> – ${L('mobilní kopie u externisty neodpovídá aktuálnímu stavu originálu. Vystavte novou kopii.','contractor mobile copy is out of date. Issue a new copy.')} <a href="#" data-act="open" data-id="${p.id}" data-tab="copies">${L('Kopie','Copies')}</a></div></div>`);
 const rows=ps.filter(isLive).sort((a,b)=>validEnd(a)-validEnd(b));
 return `<div class="pagehead"><div><h1>${L('Přehled povolení k práci','Permit-to-work overview')}</h1><div class="muted">${esc(S.settings.plant)} · ${fmt(nowLocal())}</div></div><div class="sp"></div>
  <div class="btnrow"><button class="btn" data-act="go" data-v="board">${ic('board')}${L('Otevřít board','Open board')}</button><button class="btn primary" data-act="new">${ic('plus')}${L('Nové povolení','New permit')}</button></div></div>
 <div class="kpis">${k(live.length,'Aktivní povolení','Active permits','green','live')}${k(soon.length,`Končí do ${S.settings.soonMin/60} h`,`Ending within ${S.settings.soonMin/60} h`,'orange','live')}${k(exp.length,'Prošlá platnost','Expired','red','live')}${k(hot.length,'Svařování / pož. dohled','Hot work / fire watch','orange','live')}${k(atm.length,'Uzavřené prostory','Confined spaces','dark','live')}${k(drafts.length+susp.length,'Koncepty / pozastavené','Drafts / suspended','yellow','draft')}</div>
 ${alerts}
 <div class="card"><h3>${ic('shield')}${L('Probíhající práce','Work in progress')}</h3>
 ${rows.length?permTable(rows):`<div class="empty">${ic('doc')}<div>${L('Žádné aktivní povolení.','No active permits.')}</div>${S.permits.length?'':`<div style="margin-top:12px" class="btnrow" style="justify-content:center"><button class="btn primary" data-act="new">${ic('plus')}${L('Vytvořit první povolení','Create first permit')}</button><button class="btn" data-act="demo">${L('Načíst ukázková data','Load sample data')}</button></div>`}</div>`}
 </div>`;
}
function permTable(rows){
 return `<table class="t resp"><thead><tr><th>${L('Číslo','No.')}</th><th>${L('Stav','Status')}</th><th>${L('Dodavatel','Contractor')}</th><th>${L('Místo / úkol','Location / task')}</th><th>${L('Platnost do','Valid until')}</th><th>${L('Doplňková povolení','Add. permits')}</th><th>${L('Kopie','Copies')}</th></tr></thead><tbody>
 ${rows.map(p=>{const ve=validEnd(p),left=ve-Date.now(),fw=fireWatch(p);const mob=p.copies.mobile.at(-1);
  return `<tr class="click" data-act="open" data-id="${p.id}"><td><b class="mono">${esc(p.no)}</b></td><td>${badge(p)}</td><td>${esc(p.s1.supplier||'—')}<div class="small muted">${esc(p.s1.supContact)}</div></td>
  <td><b>${esc(p.s1.location||'—')}</b><div class="small muted">${esc((p.s1.description||'').slice(0,80))}</div></td>
  <td>${isNaN(ve)?'—':fmtShort(toLocal(ve))}${isLive(p)&&!isNaN(ve)?`<div class="small ${left<0?'':'muted'}" style="${left<0?'color:var(--red);font-weight:700':''}">${left<0?L('prošlo','expired')+' '+dur(-left):L('zbývá','left')+' '+dur(left)}</div>`:''}</td>
  <td>${p.s5.hot?`<span class="tag hot">KK_053${welding(p)?' · '+L('svařuje se','welding'):fw?' · '+L('dohled','watch'):''}</span>`:''}${p.s5.confined?`<span class="tag atm">KK_047</span>`:''}${p.s5.atex?'<span class="tag">ATEX</span>':''}${p.s5.border?'<span class="tag">B</span>':''}${p.s5.roof?`<span class="tag">${L('Střecha','Roof')}</span>`:''}${p.s5.excav?`<span class="tag">${L('Výkop','Excav.')}</span>`:''}</td>
  <td class="small">${ic('lock')} ${esc(p.holder.name||'—')}${p.copies.board?`<br>${ic('board')} board`:''}${mob?`<br>${ic('mobile')} ${esc(mob.holder)}${mob.key!==payloadKey(p)?' <span class="tag warn">'+L('zastaralá','stale')+'</span>':''}`:''}</td></tr>`}).join('')}
 </tbody></table>`;
}

/* ---------- list ---------- */
function viewList(){
 const q=R.q.toLowerCase();
 let rows=S.permits.slice().sort((a,b)=>b.createdAt-a.createdAt);
 const f=R.filter;
 if(f==='live')rows=rows.filter(isLive);else if(f==='draft')rows=rows.filter(p=>p.status==='draft');else if(f==='done')rows=rows.filter(p=>['completed','closed','cancelled'].includes(p.status));
 if(q)rows=rows.filter(p=>[p.no,p.s1.supplier,p.s1.location,p.s1.description,p.s1.supContact,p.holder.name].join(' ').toLowerCase().includes(q));
 const fb=(v,cs,en)=>`<button class="pill ${f===v?'on':''}" data-act="filter" data-f="${v}">${L(cs,en)}</button>`;
 return `<div class="pagehead"><div><h1>${L('Povolení k práci','Permits to work')}</h1><div class="muted">${S.permits.length} ${L('záznamů celkem','records in total')}</div></div><div class="sp"></div><button class="btn primary" data-act="new">${ic('plus')}${L('Nové povolení','New permit')}</button></div>
 <div class="card"><div class="filters">${fb('live','Probíhající','In progress')}${fb('draft','Koncepty','Drafts')}${fb('done','Ukončené','Finished')}${fb('all','Vše','All')}<div style="flex:1"></div><input class="inp" id="q" placeholder="${L('Hledat číslo, dodavatele, místo…','Search no., contractor, location…')}" value="${esc(R.q)}"></div>
 ${rows.length?permTable(rows):`<div class="empty">${ic('doc')}<div>${L('Nic nenalezeno.','Nothing found.')}</div></div>`}</div>`;
}

/* ---------- field helpers ---------- */
let LOCK=false;
const dis=()=>LOCK?'disabled':'';
function fText(p,path,cs,en,o={}){const v=getPath(p,path)??'';return `<div class="f ${o.req?'req':''} ${o.cls||''}"><label>${L(cs,en)}</label><input type="${o.type||'text'}" data-path="${path}" value="${esc(v)}" ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${(o.lock??LOCK)?'disabled':''} ${o.min!=null?`min="${o.min}"`:''}>${o.hint?`<div class="hint">${o.hint}</div>`:''}</div>`}
function fArea(p,path,cs,en,o={}){const v=getPath(p,path)??'';return `<div class="f ${o.req?'req':''} ${o.cls||''}"><label>${L(cs,en)}</label><textarea data-path="${path}" ${(o.lock??LOCK)?'disabled':''} ${o.ph?`placeholder="${esc(o.ph)}"`:''}>${esc(v)}</textarea>${o.hint?`<div class="hint">${o.hint}</div>`:''}</div>`}
function fSel(p,path,cs,en,opts,o={}){const v=getPath(p,path)??'';return `<div class="f ${o.req?'req':''} ${o.cls||''}"><label>${L(cs,en)}</label><select data-path="${path}" ${(o.lock??LOCK)?'disabled':''}><option value="">— ${L('vyberte','select')} —</option>${opts.map(x=>`<option value="${esc(x[0])}" ${x[0]===v?'selected':''}>${esc(lbl(x))}</option>`).join('')}</select></div>`}
function yn(p,path,o={}){const v=getPath(p,path);const l=o.lock??LOCK;return `<span class="yn"><button class="y ${v==='A'?'on':''}" data-act="yn" data-path="${path}" data-v="A" ${l?'disabled':''}>${L('ANO','YES')}</button><button class="n ${v==='N'?'on':''}" data-act="yn" data-path="${path}" data-v="N" ${l?'disabled':''}>${L('NE','NO')}</button></span>`}
function ynRow(p,path,cs,en,o){return `<div class="ynrow"><div class="q">${L(cs,en)}</div>${yn(p,path,o)}</div>`}
function chk(p,path,text,o={}){const v=!!getPath(p,path);const l=o.lock??LOCK;return `<label class="chk ${v?'on':''} ${l?'dis':''}"><input type="checkbox" data-path="${path}" ${v?'checked':''} ${l?'disabled':''}><span>${text}</span></label>`}
function sig(p,path,cs,en,o={}){const s=getPath(p,path);const l=o.lock??LOCK;
 if(s)return `<div class="sig done"><div class="role">${L(cs,en)}</div>${s.sig?`<img src="${s.sig}" alt="">`:''}<div class="who">${esc(s.name)}</div><div class="when">${fmt(toLocal(s.at))}${s.fn?' · '+esc(s.fn):''}</div>${l?'':`<button class="btn sm danger" data-act="unsign" data-path="${path}">${L('Zrušit podpis','Remove signature')}</button>`}</div>`;
 return `<div class="sig"><div class="role">${L(cs,en)}</div><div class="muted small" style="flex:1">${L('Nepodepsáno','Not signed')}</div>${l?'':`<button class="btn sm primary" data-act="sign" data-path="${path}" data-role="${esc(L(cs,en))}" data-name="${esc(o.name||'')}" ${o.fn?'data-fn="1"':''}>${ic('pen')}${L('Podepsat','Sign')}</button>`}</div>`}

/* ---------- editor ---------- */
const TABS=[['basic','1 · Základní údaje','1 · Basics'],['risk','2–4 · Rizika a systém','2–4 · Hazards & system'],['add','5 · Doplňková povolení','5 · Additional permits'],['iso','6–7 · Odpojení a OOPP','6–7 · Isolation & PPE'],['hot','KK_053 · Svařování','KK_053 · Hot work'],['atm','KK_047 · Atmosféra','KK_047 · Atmosphere'],['appr','8 · Vydání a pracovníci','8 · Issue & workers'],['ext','9–10 · Prodloužení a ukončení','9–10 · Extension & close'],['copies','Kopie a historie','Copies & history']];
function viewEdit(p){
 const st=effStatus(p);
 const tabs=TABS.filter(t=>(t[0]!=='hot'||p.s5.hot)&&(t[0]!=='atm'||p.s5.confined));
 if(!tabs.find(t=>t[0]===R.tab))R.tab='basic';
 const rd=readiness(p);
 const bad=new Set(rd.filter(x=>!x.ok).map(x=>x.tab));
 const coreLocked=p.status!=='draft';
 const tabHtml=tabs.map(t=>`<button class="${R.tab===t[0]?'on':''}" data-act="tab" data-t="${t[0]}">${p.status==='draft'&&!['ext','copies'].includes(t[0])?`<span class="dot ${bad.has(t[0])?'bad':'ok'}"></span>`:''}${esc(lbl(t))}</button>`).join('');
 let body='';
 LOCK=coreLocked;
 let banner='';
 if(coreLocked&&!['ext','copies'].includes(R.tab))banner=`<div class="banner info">${ic('lock')}<div>${L('Povolení bylo vydáno – podmínky jsou uzamčeny. <b>Změní-li se podmínky nebo určené osoby, musí být vystaveno nové povolení</b> (KK_053 bod 12).','The permit has been issued – conditions are locked. <b>If conditions or appointed persons change, a new permit must be issued</b> (KK_053 item 12).')}</div></div>`;
 switch(R.tab){
  case 'basic':body=tabBasic(p);break;case 'risk':body=tabRisk(p);break;case 'add':body=tabAdd(p);break;case 'iso':body=tabIso(p);break;
  case 'hot':body=tabHot(p);break;case 'atm':body=tabAtm(p);break;case 'appr':body=tabAppr(p);break;case 'ext':body=tabExt(p);break;case 'copies':body=tabCopies(p);break;
 }
 LOCK=false;
 return `<div class="pagehead"><button class="btn" data-act="go" data-v="list">${ic('back')}${L('Zpět','Back')}</button><div><h1>${L('Povolení k práci','Permit to work')} <span class="mono">${esc(p.no)}</span></h1><div class="muted">${esc(p.s1.supplier||L('Nový dodavatel','New contractor'))} · ${esc(p.s1.location||'')}</div></div><div class="sp"></div>${badge(p)}</div>
 <div class="editor"><div><div class="tabs">${tabHtml}</div>${banner}${body}</div><aside class="side" id="side">${sidePanel(p,rd)}</aside></div>`;
}
function sidePanel(p,rd){
 rd=rd||readiness(p);const st=effStatus(p);const okN=rd.filter(x=>x.ok).length;const ve=validEnd(p);
 let actions='';
 if(p.status==='draft')actions=`<button class="btn ok" data-act="activate" ${ready(p)?'':'disabled'}>${ic('check')}${L('Vydat povolení','Issue permit')}</button>`;
 if(p.status==='active')actions=`<button class="btn warn" data-act="status" data-s="suspended">${L('Pozastavit','Suspend')}</button><button class="btn" data-act="tab" data-t="ext">${L('Prodloužit / ukončit','Extend / close')}</button>`;
 if(p.status==='suspended')actions=`<button class="btn ok" data-act="status" data-s="active">${L('Obnovit práce','Resume work')}</button><button class="btn" data-act="tab" data-t="ext">${L('Ukončit','Close')}</button>`;
 const fw=fireWatch(p);
 return `<div class="card"><div class="small muted">${L('Povolení k práci','Permit to work')} · KI_F_057</div><div class="permno">${esc(p.no)}</div><div style="margin:6px 0 10px">${badge(p)}</div>
 <div class="small">${L('Platnost','Validity')}: <b>${fmtShort(p.s8.validFrom)} – ${isNaN(ve)?'—':fmtShort(toLocal(ve))}</b></div>
 ${isLive(p)&&!isNaN(ve)?`<div class="small" style="margin-top:3px">${ve<Date.now()?`<b style="color:var(--red)">${L('Platnost vypršela','Expired')} ${dur(Date.now()-ve)}</b>`:`${L('Zbývá','Remaining')}: <b>${dur(ve-Date.now())}</b>`}</div>`:''}
 ${fw?`<div class="small" style="margin-top:6px;color:#a34a00"><b>${ic('flame')} ${L('Pož. dohled do','Fire watch until')} ${fmtTime(fw.until)}</b> · ${L('další kontrola','next check')} ${fmtTime(fw.next)}</div>`:''}
 ${welding(p)?`<div class="small" style="margin-top:6px;color:#a34a00"><b>${ic('flame')} ${L('Probíhá svařování od','Welding since')} ${fmtTime(p.hot.weldStart)}</b></div>`:''}
 <div class="btnrow" style="margin-top:12px">${actions}<button class="btn sm" data-act="printmenu">${ic('print')}${L('Tisk','Print')}</button>${isLive(p)?`<button class="btn sm" data-act="mobile">${ic('qr')}${L('Mobilní kopie','Mobile copy')}</button>`:''}</div></div>
 ${p.status==='draft'?`<div class="card"><h3 style="font-size:14px">${ic('check')}${L('Připravenost k vydání','Ready to issue')} <span class="muted small" style="margin-left:auto">${okN}/${rd.length}</span></h3>
 <ul class="checklist">${rd.map(x=>`<li class="${x.ok?'ok':'bad'}" ${x.ok?'':`data-act="tab" data-t="${x.tab}"`}><span class="st">${x.ok?'✓':'!'}</span><span>${esc(x.t)}</span></li>`).join('')}</ul></div>`:''}
 <div class="card"><h3 style="font-size:14px">${ic('copy')}${L('Originál a kopie','Original & copies')}</h3>${copiesMini(p)}</div>`;
}
function copiesMini(p){const mob=p.copies.mobile.at(-1);const stale=mob&&mob.key!==payloadKey(p);
 return `<div class="copy"><div class="ci o">${ic('lock')}</div><div class="tx"><b>${L('Originál','Original')}</b>${esc(p.holder.name||'—')} · ${esc(p.holder.role||'')}</div></div>
 <div class="copy"><div class="ci b">${ic('board')}</div><div class="tx"><b>${L('Kopie – digitální board','Copy – digital board')}</b>${p.copies.board?(isLive(p)?L('Zobrazeno na boardu','Shown on board'):L('Zobrazí se po vydání','Shown after issue')):L('Nezobrazovat','Hidden')}</div></div>
 <div class="copy"><div class="ci m">${ic('mobile')}</div><div class="tx"><b>${L('Kopie – mobil příjemce','Copy – receiver mobile')}</b>${mob?`${esc(mob.holder)} · ${fmtShort(toLocal(mob.at))}${stale?` <span class="tag warn">${L('zastaralá','stale')}</span>`:''}`:L('Zatím nevystavena','Not issued yet')}</div></div>`}

function tabBasic(p){
 return `<div class="card"><h3><span class="num">1</span>${L('Dodavatel a kontakty','Contractor & contacts')}</h3><div class="grid g3">
 ${fText(p,'s1.supplier','Název dodavatele','Contractor name',{req:1,cls:'span2'})}${fText(p,'s1.emergencyTel','Telefon v případě nouze (dodavatel)','Emergency phone (contractor)',{req:1,type:'tel'})}
 ${fText(p,'s1.supContact','Kontaktní osoba (za dodavatele)','Contact person (contractor)',{req:1})}${fText(p,'s1.supTel','Tel.','Phone',{req:1,type:'tel'})}<div></div>
 ${fText(p,'s1.kiContact','Kontaktní osoba v závodě (KI)','Plant contact (KI)',{req:1})}${fText(p,'s1.kiTel','Tel.','Phone',{type:'tel'})}<div></div>
 ${fText(p,'s1.supEmergContact','Kontakt pro dodavatele v případě nouze','Contractor emergency contact')}${fText(p,'s1.supEmergTel','Tel.','Phone',{type:'tel'})}<div></div>
 ${fText(p,'s1.itContact','Kontaktní osoba v závodě KI IT','Plant IT contact')}${fText(p,'s1.itTel','Tel.','Phone',{type:'tel'})}</div></div>
 <div class="card"><h3><span class="num">1</span>${L('Pracovní úkol','Work task')}</h3><div class="grid g2">
 ${fArea(p,'s1.description','Popis pracovního úkolu','Task description',{req:1,cls:'spanall'})}
 ${fArea(p,'s1.location','Přesné umístění a přesné určení zařízení','Exact location and equipment',{req:1})}
 <div class="grid">${fText(p,'s1.building','Stavební objekt','Building')}${fText(p,'s1.plannedEnd','Předpokládané ukončení','Expected completion',{type:'datetime-local'})}</div></div></div>
 <div class="card"><h3>${ic('lock')}${L('Originál povolení','Permit original')}</h3><div class="grid g2">
 ${fText(p,'holder.name','Držitel originálu – odpovědná osoba KI','Original holder – KI responsible person',{req:1,lock:false,hint:L('Originál zůstává u odpovědné osoby závodu; kopie jsou board a mobil příjemce.','The original stays with the plant responsible person; copies go to the board and the receiver’s phone.')})}
 ${fText(p,'holder.role','Funkce','Function',{lock:false})}</div></div>`;
}
function tabRisk(p){
 const risks=`<div class="riskgrid">${RISKS.map(g=>`<div class="riskcol"><h4>${esc(L(g.cs,g.en))}</h4>${g.items.map(i=>chk(p,'risks.'+i[0],esc(lbl(i)))).join('')}</div>`).join('')}</div>`;
 return `<div class="card"><h3><span class="num">2</span>${L('Rizika a nebezpečí – označte relevantní','Hazards – mark the relevant ones')}</h3>${risks}</div>
 <div class="card"><h3><span class="num">3</span>${L('Systém bezpečné práce','Safe system of work')}</h3>
 <div class="radioline">${SYSTEMS.map(s=>`<button class="pill ${p.s3.system===s[0]?'on':''}" data-act="set" data-path="s3.system" data-v="${s[0]}" ${dis()}>${esc(lbl(s))}</button>`).join('')}</div>

  const now=Date.now(),ve=d.ve,left=ve-now,started=T(d.vf)<=now;
  let cls='',head='',cd='';

  const em=(d.em||'').split('/')[0].trim();
  $('#main').innerHTML=`<div class="mhead"><div class="wm">${L('KOPIE','COPY')}</div><div class="wordmark">KNAUF <span>INSULATION</span></div><div class="no">${esc(d.no)}</div><div class="ty">${L('Povolení k práci – mobilní kopie příjemce','Permit to work – receiver mobile copy')} · ${esc(d.pl)}</div></div>

  <div class="msec"><h3>${ic('phone')}${L('V nouzi','Emergency')}</h3>${tel(em,L('Tísňová linka','Emergency'))}${tel(d.gt,L('Ohlašovna / vrátnice','Gate / fire reporting'),'sec')}${tel(d.kt,L('Kontakt KI','KI contact')+' '+(d.kc||''),'sec')}</div>
  <div class="msec"><h3>${ic('doc')}${L('Práce','Work')}</h3>${row(L('Místo','Location'),esc(d.lo))}${row(L('Objekt','Building'),esc(d.bo))}${row(L('Úkol','Task'),esc(d.ds))}${row(L('Dodavatel','Contractor'),esc(d.su))}${row(L('Příjemce','Receiver'),esc(d.rc||d.sc))}${row(L('Povolení vydal','Issued by'),esc(d.ib))}${row(L('Vedoucí směny','Shift manager'),esc(d.sm))}${row(L('Originál drží','Original held by'),esc(d.hd))}</div>
  ${d.h?`<div class="msec" style="border-left:5px solid var(--orange)"><h3>${ic('flame')}KK_053 · ${L('Práce s otevřeným ohněm','Hot work')}</h3>${row(L('Poř. č.','Seq.'),esc(d.h.q))}${row(L('Způsob','Method'),esc(lbl(METHODS.find(m=>m[0]===d.h.m)||['',d.h.m||'—',d.h.m||'—'])))}${row(L('Svařování','Welding'),fmtShort(d.h.f)+' – '+fmtShort(d.h.t))}${row(L('Požární dohled','Fire watch'),esc(d.h.wa.join(', ')))}${row(L('Dohled po svařování','Post-weld watch'),d.h.ph+' h / '+d.h.iv+' min')}${row(L('Ukončení hlásit','Report end to'),esc(d.h.rt))}
   <div class="small muted" style="margin-top:6px">${L('V okruhu 3 m žádný hořlavý materiál · hasicí přístroj na místě · při změně podmínek práci přerušit a informovat nadřízeného a technika PO.','No flammables within 3 m · extinguisher on site · if conditions change, stop and inform supervisor and fire technician.')}</div></div>`:''}

function modal(title,body,buttons,opts={}){
 const bg=document.createElement('div');bg.className='modalbg';
 bg.innerHTML=`<div class="modal" style="${opts.w?`width:min(${opts.w}px,100%)`:''}"><header><h3>${title}</h3><button class="btn sm" data-x>${ic('x')}</button></header><div class="body">${body}</div>${buttons?`<footer>${buttons}</footer>`:''}</div>`;

 let drawing=false,inked=false,last=null;
 const pos=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
 c.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);c.setPointerCapture(e.pointerId)});

   confirmBox(msg,()=>{p.status=s;touch(p,`${L('Stav','Status')}: ${L(...STATUS[s])}`);render()},s!=='active');break}

  case 'weld':{const h=p.hot;const k=a.dataset.k;const by=(h.watchers[0]||'')+'';
   if(k==='start'){if(Date.now()<T(h.from)||Date.now()>T(h.to)){confirmBox(L('Aktuální čas je mimo povolený rozsah svařování (bod 6). Přesto zahájit?','Current time is outside the permitted welding window (item 6). Start anyway?'),()=>{h.weldStart=Date.now();h.log.push({type:'start',at:Date.now(),by});touch(p,L('Zahájeno svařování','Welding started'));render()},1);break}

 }

function dl(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}

document.addEventListener('input',e=>{

  if(t.dataset.path==='risks.spark'&&t.checked&&!p.s5.hot){p.s5.hot=true;if(!p.hot)p.hot=newHot(p);toast(L('Jiskry / plamen → přidán KK_F053','Sparks / flame → KK_F053 added'))}
  if(t.dataset.path==='hot.chk.gasmon'&&t.checked&&!p.s5.confined){p.s5.confined=true;if(!p.atm)p.atm=newAtm(p);toast(L('Sledování koncentrace → přidán KK_F047','Gas monitoring → KK_F047 added'))}
  touch(p);render();return}
 if(t.dataset.path&&t.tagName==='SELECT'){const p=curP();if(p){setPath(p,t.dataset.path,t.value);touch(p);render()}return}
 if(t.dataset.path&&t.type==='datetime-local'){render();return}
 if(t.id==='logoIn'&&t.files[0]){const r=new FileReader();r.onload=()=>{S.settings.logo=r.result;save();render()};r.readAsDataURL(t.files[0])}

});

const GASKEY=[['o2',/\b(o2|kyslik\w*|oxygen)\b/],['so2',/\b(so2|oxid\w* sirici\w*)/],['nh3',/\b(nh3|amoniak\w*|cpav\w*|ammonia)/],['ch4',/\b(ch4|methan\w*|metan\w*|dmv|lel)\b/],['co',/\b(co|oxid\w* uhelnat\w*|carbon monoxide)\b/]];

function nums(n){return (n.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>+x.replace(',','.'))}
function after(text,n,re){const m=n.match(re);if(!m)return '';let r=text.slice(m.index+m[0].length);r=r.replace(/^[\s:=–\-]*(na |je |to |:)?\s*/i,'').replace(/^["„“']+|["“”']+$/g,'').trim();return r}
function setS(path,val,label,unit=''){
 const old=getPath(S.settings,path);const oldC=Array.isArray(old)?old.slice():old;
 if(JSON.stringify(oldC)===JSON.stringify(val))return `<div class="chg">${ic('check')}<span><b>${esc(label)}</b>: ${L('už je nastaveno na','already set to')} <b>${esc(Array.isArray(val)?val.join(', '):val)}${unit}</b></span></div>`;
 setPath(S.settings,path,val);
 const show=v=>Array.isArray(v)?(v.join(', ')||'—'):(v===''||v==null?'—':v);
 S.settings.changeLog=(S.settings.changeLog||[]).concat({at:Date.now(),label,from:String(show(oldC)),to:String(show(val))}).slice(-200);
 AS.undo.push({path,old:oldC,label});save();
 if(path==='lang'){LANG=val}
 refreshBehind();
 return `<div class="chg">${ic('check')}<span><b>${esc(label)}</b>: <s>${esc(show(oldC))}${unit}</s> → <b>${esc(show(val))}${unit}</b></span></div>`;
}

function asstHandle(text){
 const n=nrm(text).trim();const has=re=>re.test(n);const N=nums(n.replace(/\b(o2|so2|nh3|ch4|kk_?053|x-am)\b/g,' '));
 if(!n)return '';
 if(has(/^(\?|(napoveda|help|pomoc|co umis|ahoj|dobry den|hi|hello)\b)/))return asstHelp();
 if(has(/^(zpet|vrat|vratit|vratte|undo|storno)\b/)){const u=AS.undo.pop();if(!u)return L('Není co vrátit.','Nothing to undo.');const r=setS(u.path,u.old,u.label+' ('+L('vráceno','undone')+')');AS.undo.pop();return L('Vráceno.','Undone.')+r}
 if(has(/(historie|log|zmeny nastaveni|change history)/)){const c=(S.settings.changeLog||[]).slice(-12).reverse();return c.length?`<b>${L('Poslední změny nastavení','Recent settings changes')}</b><ul>${c.map(x=>`<li>${fmtShort(toLocal(x.at))} – ${esc(x.label)}: ${esc(x.from)} → ${esc(x.to)}</li>`).join('')}</ul>`:L('Zatím žádné změny.','No changes yet.')}
 if(has(/(zobraz|ukaz|vypis|show|aktualni).*(nastaveni|limit|settings)|^nastaveni$|^limity$/))return asstSummary();
 if(has(/(instal|nainstal)/)){setTimeout(installApp,50);return L('Otevírám instalaci aplikace…','Opening app installation…')}
 if(has(/(zaloh|export|backup)/)){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});dl(b,`povoleni-k-praci-${new Date().toISOString().slice(0,10)}.json`);return L('Záloha JSON se stahuje.','JSON backup downloading.')}
 if(has(/\b(jazyk|language|prepni)\b/)||has(/^(english|anglicky|cesky|czech)$/)){const en=has(/(angl|english|\ben\b)/);return setS('lang',en?'en':'cs',L('Jazyk','Language'))}
 // custom lists
 const listCmd=(key,word,label)=>{const add=has(new RegExp(`(pridej|pridat|novy|nova|nove|add)\\b.*${word}`));const rem=has(new RegExp(`(odeber|odebrat|smaz|odstran|vymaz|remove|delete)\\b.*${word}`));if(!add&&!rem)return null;
  const name=after(text,n,new RegExp(`${word}\\w*`));if(!name)return L('Napište i název, např. „přidej prostor Silo 3“.','Add a name, e.g. “add space Silo 3”.');
  const arr=(S.settings[key]||[]).slice();const i=arr.findIndex(x=>nrm(x)===nrm(name));
  if(add){if(i>=0)return L(`„${esc(name)}“ už v seznamu je.`,`“${esc(name)}” is already listed.`);arr.push(name);return setS(key,arr,label)+`<div class="small muted" style="margin-top:4px">${L('Nově se nabízí ve formuláři KK_047.','Now offered in form KK_047.')}</div>`}
  if(i<0)return L(`„${esc(name)}“ v seznamu není. Vlastní položky: ${esc(arr.join(', ')||'—')}`,`“${esc(name)}” not found.`);arr.splice(i,1);return setS(key,arr,label)};
 let r=listCmd('extraSpaces','(prostor|space)',L('Vlastní uzavřené prostory','Custom confined spaces'));if(r)return r;
 r=listCmd('extraDevices','(pristroj|detektor|meric\\w*|device)',L('Vlastní měřicí přístroje','Custom gas detectors'));if(r)return r;
 // gas limits
 const g=GASKEY.find(x=>x[1].test(n)&&(x[0]!=='co'||has(/(limit|max|ppm|nastav|co\s*(na|=|:)?\s*\d)/)));
 if(g){const warn=`<div class="warnline">⚠ ${L('Limity musí odpovídat schválení HSE / technika PO.','Limits must match HSE / fire technician approval.')}</div>`;
  if(!N.length)return L(`Jakou hodnotu nastavit pro ${g[0].toUpperCase()}? Např. „${g[0].toUpperCase()} ${S.settings.limits[g[0]==='o2'?'o2min':g[0]]}“.`,`Which value for ${g[0].toUpperCase()}?`);
  if(g[0]==='o2'){let out='';const ok=(k,v)=>k==='o2min'?v>=18&&v<=21:v>=21&&v<=25;
   let pairs=[];if(N.length>=2){const [a,b]=[Math.min(N[0],N[1]),Math.max(N[0],N[1])];pairs=[['o2min',a],['o2max',b]]}
   else if(has(/(min|dolni|spodni|nejmene|low)/))pairs=[['o2min',N[0]]];else if(has(/(max|horni|nejvice|high)/))pairs=[['o2max',N[0]]];
   else return L(`Je ${N[0]} % minimum, nebo maximum kyslíku? Napište „O2 min ${N[0]}“ nebo „O2 max ${N[0]}“, případně rozsah „kyslík 19,5–23,5“.`,`Is ${N[0]} % the O₂ minimum or maximum?`);
   for(const [k,v] of pairs){if(!ok(k,v))return L(`Hodnota ${v} % pro ${GASLBL[k]} je mimo rozumný rozsah – změnu jsem neprovedl.`,`${v} % is out of range for ${GASLBL[k]} – not changed.`);}
   pairs.forEach(([k,v])=>{out+=setS('limits.'+k,v,GASLBL[k],' %');if((k==='o2min'&&v<DEFAULT_SETTINGS.limits.o2min)||(k==='o2max'&&v>DEFAULT_SETTINGS.limits.o2max))out+=`<div class="warnline">⚠ ${L(`${GASLBL[k]} je méně přísné než výchozí ${DEFAULT_SETTINGS.limits[k]} %.`,`${GASLBL[k]} is less strict than default.`)}</div>`});return L('Hotovo.','Done.')+out+warn}
  const v=N[0];if(!(v>0)||v>1000)return L('Hodnota mimo rozsah – změnu jsem neprovedl.','Value out of range – not changed.');
  const def=DEFAULT_SETTINGS.limits[g[0]];return L('Hotovo.','Done.')+setS('limits.'+g[0],v,GASLBL[g[0]])+(v>def?`<div class="warnline">⚠ ${L(`Nová hodnota je vyšší (méně přísná) než výchozí ${def}.`,`New value is higher (less strict) than default ${def}.`)}</div>`:'')+warn}
 // fire watch
 if(has(/interval/)||(has(/kontrol/)&&has(/min/))){const v=N[0];if(!(v>=5&&v<=240))return L('Interval zadejte v minutách (5–240), např. „interval kontrol 20 min“.','Give the interval in minutes (5–240).');return setS('defInterval',v,L('Výchozí interval kontrol po svařování','Default post-weld check interval'),' min')+`<div class="small muted" style="margin-top:4px">${L('Platí pro nově vytvořené KK_053.','Applies to newly created KK_053.')}</div>`}
 if(has(/(dohled|po svarovani|post.?weld)/)){const v=N[0];if(!v)return L('Kolik hodin? Např. „dohled po svařování 10 h“.','How many hours?');if(v<8)return L('KK_053 vyžaduje dohled po svařování <b>minimálně 8 hodin</b> – nižší hodnotu nenastavím.','KK_053 requires at least 8 hours – not changed.');return setS('defPostHours',v,L('Výchozí dohled po svařování','Default post-weld watch'),' h')+`<div class="small muted" style="margin-top:4px">${L('Platí pro nově vytvořené KK_053.','Applies to newly created KK_053.')}</div>`}
 if(has(/(upozorn|predem|konec platnosti|konci do|warn)/)){let v=N[0];if(!v)return L('Kolik minut nebo hodin předem?','How long before?');if(has(/\d\s*(h|hod)/))v*=60;return setS('soonMin',Math.round(v),L('Upozornění na konec platnosti předem','Expiry warning before'),' min')}
 if(has(/(053|svarov\w* cislo|poradov)/)&&N.length){return setS('nextHot',Math.round(N[0]),L('Další poř. číslo KK_053','Next KK_053 seq. no.'))}
 if(has(/(cislo povoleni|dalsi cislo|cislovani|next permit|permit number)/)){const v=Math.round(N[0]);if(!v)return L('Zadejte číslo, např. „další číslo povolení 200“.','Give a number.');if(S.permits.some(p=>p.no==='T '+String(v).padStart(4,'0')))return L(`Číslo T ${String(v).padStart(4,'0')} už existuje – zvolte vyšší.`,`Number exists already.`);return setS('nextNo',v,L('Další číslo povolení','Next permit number'))}
 const phone=t=>(t.match(/[+\d][\d\s/+]*\d/g)||[]).join(' / ').replace(/\s+/g,' ').trim();
 if(has(/(tisnov|nouz|emergenc|zachrann|hasic)/)){const v=phone(after(text,n,/(tisnov\w*|nouz\w*|emergenc\w*)( cisl\w*| linka| linky)?/));if(!v)return L('Napište čísla, např. „tísňové číslo 150 / 112“.','Give the numbers.');return setS('emergency',v,L('Tísňová čísla','Emergency numbers'))}
 if(has(/(vratnic|ohlasovn|gate)/)){const v=phone(text);if(!v)return L('Napište telefon vrátnice.','Give the gate phone.');return setS('gateTel',v,L('Telefon vrátnice / ohlašovny','Gate phone'))}
 if(has(/https?:\/\//)){const m=text.match(/https?:\/\/\S+/);let u=m[0];if(!u.endsWith('/')&&!/\.html?$/.test(u))u+='/';return setS('publicUrl',u,L('Veřejná adresa aplikace','Public app URL'))+`<div class="small muted" style="margin-top:4px">${L('QR kódy mobilních kopií teď povedou sem.','Mobile copy QR codes now point here.')}</div>`}
 if(has(/(drzitel|funkce)/)){const v=after(text,n,/(funkc\w*( drzitel\w*)?|drzitel\w*( originalu)?)/);if(!v)return L('Napište funkci, např. „funkce držitele Vedoucí směny“.','Give the function.');return setS('holderDefault',v,L('Výchozí funkce držitele originálu','Default original holder function'))}
 if(has(/(nazev zavodu|zavod|plant)/)){const v=after(text,n,/(nazev zavodu|zavod\w*|plant name|plant)/);if(!v)return L('Napište název, např. „název závodu Závod Krupka“.','Give the name.');return setS('plant',v,L('Název závodu','Plant name'))}
 return L(`Tomu nerozumím. ${asstHelp()}`,`Sorry, I didn’t get that. ${asstHelp()}`);
}
const CHIPS=[['Zobraz nastavení','Show settings'],['Limit CO 30','CO limit 30'],['Kyslík 19,5–23,5','Oxygen 19.5–23.5'],['Přidej prostor ','Add space '],['Tísňové číslo 150 / 112','Emergency 150 / 112'],['Dohled po svařování 10 h','Post-weld watch 10 h'],['Historie změn','Change history'],['Zpět','Undo'],['Nápověda','Help']];
function asstRender(){
 let fab=$('#asstFab'),box=$('#asst');
 if(!fab){fab=document.createElement('button');fab.id='asstFab';fab.className='asst-fab';document.body.appendChild(fab);fab.onclick=()=>{AS.open=true;asstRender();setTimeout(()=>$('#asstIn')?.focus(),50)}}
 fab.innerHTML=`<svg class="ico" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>${L('Asistent nastavení','Settings assistant')}`;
 fab.style.display=AS.open?'none':'';
 if(!AS.open){box&&box.remove();return}
 if(!box){box=document.createElement('div');box.id='asst';box.className='asst';document.body.appendChild(box)}
 if(!AS.msgs.length)AS.msgs.push({me:false,h:L('Dobrý den, jsem asistent nastavení aplikace. Napište, co chcete změnit – každou změnu potvrdím a dá se vrátit příkazem <b>zpět</b>.','Hi, I’m the settings assistant. Tell me what to change – every change is confirmed and can be reverted with <b>undo</b>.')});
 box.innerHTML=`<header>${ic('gear')}<b>${L('Asistent nastavení','Settings assistant')}<small>${L('změny limitů, kontaktů, seznamů a číslování','limits, contacts, lists and numbering')}</small></b><button data-asst="clear" title="${L('Vymazat chat','Clear chat')}">${ic('trash')}</button><button data-asst="close" title="${L('Zavřít','Close')}">${ic('x')}</button></header>
 <div class="msgs" id="asstMsgs">${AS.msgs.map(m=>`<div class="msg ${m.me?'me':'bot'}">${m.me?esc(m.h):m.h}</div>`).join('')}</div>
 <div class="chips">${CHIPS.map(c=>`<button data-chip="${esc(lbl(['',...c]))}">${esc(lbl(['',...c]).trim())}</button>`).join('')}</div>
 <form id="asstForm"><input id="asstIn" autocomplete="off" placeholder="${L('Např. limit CO 30 ppm','e.g. CO limit 30 ppm')}"><button type="submit">${ic('back','')}</button></form>`;
 box.querySelector('form button .ico').style.transform='rotate(180deg)';
 const ms=$('#asstMsgs');ms.scrollTop=ms.scrollHeight;
 box.querySelector('#asstForm').onsubmit=e=>{e.preventDefault();const i=$('#asstIn');const t=i.value.trim();if(!t)return;AS.msgs.push({me:true,h:t});let h;try{h=asstHandle(t)}catch(x){console.error(x);h=L('Při zpracování nastala chyba – zkuste to formulovat jinak.','Error – please rephrase.')}AS.msgs.push({me:false,h});asstRender();setTimeout(()=>$('#asstIn')?.focus(),20)};
 box.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{const v=b.dataset.chip;const i=$('#asstIn');if(v.endsWith(' ')){i.value=v;i.focus()}else{i.value=v;box.querySelector('#asstForm').requestSubmit()}});
 box.querySelector('[data-asst="close"]').onclick=()=>{AS.open=false;asstRender()};
 box.querySelector('[data-asst="clear"]').onclick=()=>{AS.msgs=[];asstRender()};
}
